<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Drunk Race</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="hud">
      <div class="hud-logo">DRUNK<span>RACE</span></div>
      <div class="hud-lap">
        <div class="hud-label">Volta</div>
        <div id="hud-lap" class="hud-value">1/3</div>
        <div class="hud-label">Tempo</div>
        <div id="hud-lap-time" class="hud-value hud-small">00:00.00</div>
        <div class="hud-label">Melhor</div>
        <div id="hud-best-lap" class="hud-value hud-small">--:--.--</div>
      </div>
      <div class="hud-speed">
        <div id="hud-speed" class="hud-speed-value">0</div>
        <div class="hud-label">km/h</div>
      </div>
      <div id="hud-help" class="hud-help">
        W / ↑ acelerar · S / ↓ frear e ré · A D / ← → virar · Espaço freio de mão · R voltar à pista
      </div>
      <p id="status" class="hud-status">carregando…</p>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
